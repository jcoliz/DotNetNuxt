name: Build

on:
  push:
    branches: [ main ]

env:
  SOLUTION_VERSION: 'github-${{ github.sha }}'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Run Unit Tests
      run: dotnet test ./tests/Unit --no-build --verbosity normal --collect:"XPlat Code Coverage" --logger "trx;LogFileName=unit.trx" --results-directory artifacts/test-results/unit
    - name: Publish Test Report
      if: ${{ always() && hashFiles('artifacts/test-results/**/*.trx') != '' }}
      uses: dorny/test-reporter@v3
      with:
        name: .NET Unit Test Results
        path: artifacts/test-results/**/*.trx
        reporter: dotnet-trx
        use-actions-summary: 'true'
        list-tests: all
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: artifacts/test-results/
        if-no-files-found: ignore
